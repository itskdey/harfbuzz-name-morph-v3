<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f4ee" />
  <meta name="description" content="Mean Pheakdey — a new web experience is coming soon." />
  <title>Mean Pheakdey — Coming Soon</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
</head>
<body data-phase="loading">
  <main class="hero">
    <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

    <header class="topbar" aria-label="Site navigation">
      <a class="monogram" href="#" aria-label="Mean Pheakdey home">MP</a>

      <nav class="nav" aria-label="Primary">
        <span>WORK</span>
        <span>ABOUT</span>
        <span>JOURNEY</span>
      </nav>

      <div class="site-state">
        <span class="state-dot" aria-hidden="true"></span>
        <span>COMING SOON</span>
      </div>
    </header>

    <aside class="scene-index" aria-hidden="true">
      <span id="sceneNumber" class="scene-number">01</span>
      <span class="scene-divider"></span>
      <span class="scene-total">10</span>
    </aside>

    <aside class="manifesto" aria-hidden="true">
      <span>A</span>
      <strong>BOLDER</strong>
      <span>SOFTER</span>
      <strong>BRIGHTER</strong>
      <span>TOMORROW</span>
    </aside>

    <div class="ghost-word ghost-word--top" aria-hidden="true">COMING</div>
    <div class="ghost-word ghost-word--bottom" aria-hidden="true">SOON</div>

    <div id="motionField" class="motion-field" aria-hidden="true">
      <div class="axis axis--x"></div>
      <div class="axis axis--y"></div>

      <div class="orbit orbit--outer">
        <span class="orbit-node orbit-node--a"></span>
        <span class="orbit-node orbit-node--b"></span>
      </div>
      <div class="orbit orbit--wide">
        <span class="orbit-node orbit-node--c"></span>
      </div>
      <div class="orbit orbit--inner">
        <span class="orbit-node orbit-node--d"></span>
      </div>

      <div class="motion-arc motion-arc--a"></div>
      <div class="motion-arc motion-arc--b"></div>
      <div class="motion-disc motion-disc--a"></div>
      <div class="motion-disc motion-disc--b"></div>
      <div class="motion-disc motion-disc--c"></div>

      <div id="centerGlow" class="center-glow"></div>
      <div id="impactPulse" class="impact-pulse"></div>
      <div id="motionSweep" class="motion-sweep"></div>
    </div>

    <section class="hero-core" aria-label="Mean Pheakdey coming soon">
      <div id="cameraWrap" class="camera-wrap">
        <div id="morphWrap" class="morph-wrap" aria-label="មាន ភក្តី">
          <svg id="morphStage" class="morph-stage" role="img" aria-label="មាន ភក្តី">
            <g id="echoLayer" transform="scale(1,-1)" aria-hidden="true"></g>
            <g id="glyphLayer" transform="scale(1,-1)"></g>
          </svg>
        </div>
      </div>

      <div id="subtitle" class="subtitle" aria-label="Mean Pheakdey"></div>

      <div id="comingSoon" class="coming-soon" aria-label="Coming soon">
        <span id="comingTitle" class="coming-title" aria-hidden="true"></span>
        <span class="coming-rule" aria-hidden="true"></span>
      </div>
    </section>

    <footer class="footer">
      <span>MEAN PHEAKDEY</span>
      <span class="footer-line" aria-hidden="true"></span>
      <span class="footer-status">CREATIVE IN PROGRESS <i aria-hidden="true"></i></span>
    </footer>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
