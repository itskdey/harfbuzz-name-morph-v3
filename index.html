<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>មាន ភក្តី — HarfBuzz Morph</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
</head>
<body>
  <main class="hero">
    <div id="morphWrap" class="morph-wrap" aria-label="មាន ភក្តី">
      <svg id="morphStage" class="morph-stage" role="img" aria-label="មាន ភក្តី">
        <g id="echoLayer" transform="scale(1,-1)" aria-hidden="true"></g>
        <g id="glyphLayer" transform="scale(1,-1)"></g>
      </svg>
    </div>

    <div id="subtitle" class="subtitle" aria-label="Mean Pheakdey"></div>
    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
